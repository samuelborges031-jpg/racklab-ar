# O site mudou para o Cloudflare Pages (racklab-ar.pages.dev).
# O Netlify só redireciona, para os QR Codes já impressos continuarem funcionando.
[build]
  publish = "public"

# o app Android verifica este arquivo neste endereço: não pode redirecionar
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://racklab-ar.pages.dev/:splat"
  status = 301
  force = true

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
