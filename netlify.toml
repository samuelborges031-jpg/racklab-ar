[build]
  publish = "public"
  # cada publicação gasta créditos do plano gratuito: só publica quando o site (public/) mudou
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/ netlify.toml"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/alvos.json"
  [headers.values]
    Cache-Control = "no-cache"
