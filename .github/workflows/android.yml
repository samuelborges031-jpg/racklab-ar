name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      publicar_no_site:
        description: "Publicar o APK na página de download do site (gasta 1 publicação do Netlify)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Guardar erros da compilação (para análise)
        if: failure()
        run: |
          mkdir -p ci
          { echo "build ${GITHUB_RUN_NUMBER} $(date -u)"; grep -E "^e: |^w: .*\.kt|What went wrong|Could not|error:|FAILED|Caused by|> " build.log | head -150; echo "-----"; tail -80 build.log; } > ci/ultimo-erro.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/ultimo-erro.txt
          git commit -m "Log de erro do build ${GITHUB_RUN_NUMBER}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: racklab-ar-apk
          path: android/app/build/outputs/apk/release/*.apk

      # Economia de publicações do Netlify: o APK só vai para o site quando pedido
      # (botão "Run workflow" com a opção marcada, ou "[site]" na mensagem do commit).
      # Nas demais compilações o APK fica só como artefato do GitHub e é entregue pelo chat.
      - name: Publicar APK no site (public/app)
        if: ${{ inputs.publicar_no_site || contains(github.event.head_commit.message, '[site]') }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk public/app/racklab-ar.apk
          date -u +"%Y-%m-%d %H:%M UTC · build ${GITHUB_RUN_NUMBER}" > public/app/versao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/racklab-ar.apk public/app/versao.txt
          git commit -m "APK do app RackLab AR (build ${GITHUB_RUN_NUMBER})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
