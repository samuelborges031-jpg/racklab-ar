name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle -p android assembleRelease --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: racklab-ar-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publicar APK no site (public/app)
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk public/app/racklab-ar.apk
          date -u +"%Y-%m-%d %H:%M UTC · build ${GITHUB_RUN_NUMBER}" > public/app/versao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/racklab-ar.apk public/app/versao.txt
          git commit -m "APK do app RackLab AR (build ${GITHUB_RUN_NUMBER})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
